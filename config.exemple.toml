# Copy this file to config.toml (ignored by Git), then adapt it.
# Keys and values stay as they are (French names); only these comments are in English.

# Sent to Claude to score the ads. Put nothing confidential here:
# the salary floor stays in [criteres] and is never sent.
profil = """
Décris ici ton profil en quelques lignes : métier, années d'expérience, compétences clés,
poste visé, types de structures et secteurs préférés ou exclus, lieux acceptés.
Exemple : Data Scientist, 5 ans d'expérience (NLP, MLOps). Vise un poste senior en
startup ou scale-up, à Lyon ou en télétravail. Pas de cabinet de conseil.
"""

# Title used for unsolicited applications.
role_spontane = "Data Scientist"

# Number of ads scored per call to Claude.
taille_lot = 8

[modeles]
notation = "haiku"
generation = "sonnet"
# Interview preparation sheets (with web search).
preparation = "sonnet"

[criteres]
# At least one expression must appear in the title (whole words, accents ignored).
mots_cles = [
  "data scientist", "machine learning engineer", "ml engineer", "ingenieur ia",
  # Common titles in the French civil service.
  "science des donnees", "intelligence artificielle",
]
# Search terms typed into the sites that cannot list all their ads (Workday,
# SmartRecruiters, France Travail, Choisir le service public, Station F), shared by every
# company. Keep a few broad terms: each one costs a search per company, and every ad found
# must still match "mots_cles". Required.
recherches = ["data scientist", "machine learning", "intelligence artificielle"]
# None of these expressions may appear in the title.
exclusions = ["stage", "stagiaire", "alternance", "apprenti", "intern", "internship"]
# Empty = anywhere. An ad without a location always passes.
lieux = ["lyon", "69", "remote", "teletravail"]
# Countries where ads are searched, as two-letter ISO codes (e.g. "fr", "gb", "be").
# Empty = every country. Only sources that can search by country use it (SmartRecruiters);
# the others rely on "lieux".
pays = []
# Rejects an ad only if its displayed maximum annual salary is lower. 0 = no filter.
salaire_plancher = 0

[france_travail]
# Free credentials on https://francetravail.io, given through the environment
# variables FRANCE_TRAVAIL_ID and FRANCE_TRAVAIL_SECRET (or the .env file).
actif = false
departements = ["69"]
publiee_depuis = 7

[service_public]
# Choisir le service public (choisirleservicepublic.gouv.fr): positions in the ministries,
# DGSE, DGSI, DINUM, AMIAD, ANSSI (through the SGDSN)… No credentials. Each search runs
# over the whole site, then at the employers below (results sorted by relevance, 20 per
# page).
actif = true
# Optional: replaces [criteres] recherches for this source only.
recherches = ["data scientist", "machine learning", "science des données"]
# Restricts every search to these domains; empty = all.
# Known names: Défense, Numérique, Recherche, Renseignement, Sécurité, Environnement…
domaines = []
# Known names (see EMPLOYERS in src/moteur/sources/service_public.py) or the site's
# numeric identifier: the number after /organisme/ in the address of a filtered search.
employeurs = ["DINUM", "INSEE"]
# Pages read per search (20 ads per page).
pages_max = 3

[station_f]
# Station F job board (jobs.stationf.co): ads of the start-ups hosted at Station F,
# searched through the site's public search. No credentials. Internships and
# apprenticeships are left out.
actif = false
# Pages read per search (50 ads per page).
pages_max = 3
# Ads published in the last N days.
publiee_depuis = 21

# No company here (CONF-12). Large groups and public bodies come with the tool
# (catalogue/entreprises.toml): tick or untick them in the page's Options panel. Your own
# companies (start-ups, small companies, anything else) are added by Claude through
# engine B and kept in its database: ask Claude, with the skill trouver-entreprises
# (README, "Adding companies").
