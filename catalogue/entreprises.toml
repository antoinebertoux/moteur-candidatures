# Company catalogue (specs/catalogue.md): public bodies and companies of 500 employees or
# more, shipped with the tool. Only public facts about companies: nothing about a candidate.
# Each user ticks or unticks them in the tracking page; their own companies (start-ups,
# small companies) stay in their config.toml.
#
# Fields: those of an own company (nom, ats, identifiant, site, linkedin; see
# config.exemple.toml), plus:
#   secteur  one of the sectors of CAT-04 (required)
#   taille   "public" or "grand-groupe" (required)
#   pays     two-letter ISO codes of the countries where it hires; empty = everywhere
# No "spontanee" (a personal choice) and no "recherches": Workday and SmartRecruiters
# companies are searched with the user's [criteres] mots_cles (CAT-07).

