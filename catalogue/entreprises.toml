# Company catalogue (specs/catalogue.md): public bodies and companies of 500 employees or
# more, shipped with the tool. Only public facts about companies: nothing about a candidate.
# Each user ticks or unticks them in the tracking page; their own companies (start-ups,
# small companies) are added by Claude and kept in engine B's database (CAT-20).
#
# Fields (CAT-02, CAT-08):
#   nom, ats, identifiant, site, linkedin
#   secteur  one of the sectors of CAT-04 (required)
#   taille   "public" or "grand-groupe" (required)
#   pays     two-letter ISO codes of the countries where it hires; empty = everywhere
# No "spontanee" (a personal choice) and no "recherches": Workday and SmartRecruiters
# companies are searched with the user's [criteres] recherches (CAT-07).
#
# "ats" and "identifiant" depend on the career page's tool
# (`uv run moteur detect <address>` finds them):
#   greenhouse, lever, ashby: job-boards.greenhouse.io/<id>, jobs.lever.co/<id>, jobs.ashbyhq.com/<id>
#   smartrecruiters: jobs.smartrecruiters.com/<id>, searched with [criteres] recherches
#   recruitee, teamtailor: <id>.recruitee.com, <id>.teamtailor.com
#   greenhouse hosted in Europe (job-boards.eu.greenhouse.io/<id>): identifiant "eu:<id>"
#   teamtailor on the company's domain: identifiant = the host (e.g. careers.exemple.com)
#   workday: the full address (https://<tenant>.wd3.myworkdayjobs.com/<site>),
#            searched with [criteres] recherches
#   radancy: the career site's address (e.g. careers.moodys.com), read through its sitemap
#   workable: apply.workable.com/<id>
#   welcomekit: the address of the career page hosted by Welcome to the Jungle
#               (e.g. jobs.zama.org); welcometothejungle.com itself blocks robots
#   talentsoft: the career site's host (e.g. casa-cacib-recrute.talent-soft.com),
#               read through its RSS feed
#   oracle: the career page address
#           (https://<host>/hcmUI/CandidateExperience/en/sites/<site>),
#           searched with [criteres] recherches
#   successfactors: the career site's host (e.g. jobsearch.alstom.com), searched with
#                   [criteres] recherches
#   phenom: the career site's address with country and language
#           (e.g. careers.bcg.com/global/en), searched with [criteres] recherches
#   avature: the portal's address (e.g. jobs.orano.group/fr_FR/jobs), searched with
#            [criteres] recherches (20 ads per term)
#   magnet: the career site's host (e.g. jobs.fivesgroup.com), Magnet by Hellowork
#   sitemap: an in-house site listing its offers in its sitemap, with JobPosting data
#            in each page; the address the offers sit under
#            (e.g. careers.societegenerale.com/offres-d-emploi/)
#   mckinsey: McKinsey's own career site; identifiant www.mckinsey.com (not used)
#   gestmax: the address of a Gestmax search list
#            (e.g. groupe-beaumanoir.gestmax.fr/search/index/frontsearchtab_id/7,
#            or mbda.gestmax.fr/search/index)
#   sncf: emploi.sncf.com; the group company's number in the site's « company »
#         filter (6684 SNCF Réseau, 6685 SNCF Voyageurs)
#   taleez: the Taleez career site host (e.g. tehtris.taleez.com)
#   werecruit: the WeRecruit career site address with its language
#              (e.g. careers.werecruit.io/fr/glimps)

