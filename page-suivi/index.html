<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: compact header, pipeline as counted tabs, dense list, detail unfolded in the row. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunken:#e9edf2; --ink:#17212e; --muted:#5b6878; --line:#d5dbe3;
  --accent:#1f5fa8; --accent-ink:#ffffff; --accent-soft:#e2ecf8;
  --ok:#1f7a55; --ok-soft:#dff1e8; --warn:#946200; --warn-soft:#f8ecd0; --bad:#a63a32; --bad-soft:#f7e2df;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10161d; --surface:#18212b; --sunken:#0c1117; --ink:#e4eaf1; --muted:#96a3b3; --line:#2b3745;
    --accent:#6ea8ea; --accent-ink:#0c1117; --accent-soft:#1c3048;
    --ok:#5fc79a; --ok-soft:#173326; --warn:#e0b04a; --warn-soft:#3a2e12; --bad:#ef8a80; --bad-soft:#3d1e1b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10161d; --surface:#18212b; --sunken:#0c1117; --ink:#e4eaf1; --muted:#96a3b3; --line:#2b3745;
  --accent:#6ea8ea; --accent-ink:#0c1117; --accent-soft:#1c3048;
  --ok:#5fc79a; --ok-soft:#173326; --warn:#e0b04a; --warn-soft:#3a2e12; --bad:#ef8a80; --bad-soft:#3d1e1b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.yes{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{min-height:64px;resize:vertical}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.note{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:8px 12px;font-size:13px}
.note.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.stage{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 10px;border-radius:8px;text-align:left;background:var(--surface)}
.stage .n{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stage .l{font-size:12px;color:var(--muted)}
.stage[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.stage[aria-pressed=true] .l{color:var(--ink)}
.filters select{width:auto}
.filters input{width:220px;max-width:100%}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;border-left:4px solid var(--line)}
.card.t-spontanee{border-left-color:var(--warn)}
.card.t-offre{border-left-color:var(--accent)}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:10px 12px;align-items:center}
.title{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.title:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:3px}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:500;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.spont{background:var(--warn-soft);color:var(--warn)}
.chip.offre{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
button.lettre{padding:3px 10px;font-size:12px}
button.lettre[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums}
.detail{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.liens{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 8px;overflow-wrap:anywhere}
.resume{font-size:14px;max-width:70ch;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;color:var(--muted)}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
section.panel h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
td.num{font-family:var(--mono)}
.export{font-family:var(--mono);font-size:12px;min-height:140px}
a{color:var(--accent)}
a.doc{display:inline-block;border:1px solid var(--accent);border-radius:6px;padding:5px 10px;font-weight:500;text-decoration:none;font-size:14px}
a.doc:hover{background:var(--accent-soft)}
body.depot .wrap{outline:3px dashed var(--accent);outline-offset:-6px}
@media (max-width:640px){.pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}.head{grid-template-columns:1fr}}
.fiche{border-top:1px solid var(--line);padding:12px 16px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.fiche .row{justify-content:space-between}
.fiche h1{font-family:var(--display);font-size:20px;margin:8px 0 4px}
.fiche h2{font-family:var(--display);font-size:17px;margin:18px 0 4px;color:var(--accent)}
.fiche h3{font-size:15px;margin:12px 0 2px}
.fiche p,.fiche ul,.fiche ol{margin:4px 0;max-width:75ch}
.fiche ul,.fiche ol{padding-left:22px}
.fiche code{font-family:var(--mono);font-size:13px;background:var(--sunken);border-radius:4px;padding:0 4px}
.lang{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;font-size:13px;font-family:var(--mono)}
.lang-btn .chev{width:10px;height:6px;color:var(--muted)}
.flag{display:inline-flex;width:20px;height:14px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line);flex:none}
.flag svg{width:100%;height:100%;display:block}
.lang-menu{position:absolute;left:0;top:calc(100% + 4px);z-index:10;margin:0;padding:4px;list-style:none;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.lang-menu li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px}
.lang-menu li:hover,.lang-menu li:focus{background:var(--sunken);outline:none}
.lang-menu li[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
/* Ad text (PAGE-12): a discreet link and a read-only window. */
button.mini{border:0;background:transparent;padding:0;font-size:12px;font-weight:400;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
button.mini:hover{color:var(--accent)}
dialog.texte{width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
dialog.texte::backdrop{background:rgba(0,0,0,.45)}
dialog.texte .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
dialog.texte .head h2{font-family:var(--display);font-size:17px;margin:0}
dialog.texte .fiche{border-top:0}
/* Companies searched (PAGE-70 to PAGE-74). */
.opts h3{font-family:var(--display);font-size:15px;margin:14px 0 6px}
.opts .grp{display:flex;flex-wrap:wrap;gap:6px 14px}
.opts .tick{display:inline-flex;flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.opts .tick input{margin:0;width:auto}
.opts .tick.off{color:var(--muted)}
.opts .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.opts .sector{margin-top:10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.opts .co{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:5px 0;border-bottom:1px solid var(--line)}
.opts .co .name{font-weight:500;min-width:0;flex:1 1 160px;overflow-wrap:anywhere}
.opts .co.dim .name{color:var(--muted)}
.opts .why{font-size:12px;color:var(--warn)}
.opts input[type=text]{max-width:320px}
.opts fieldset{border:0;margin:0;padding:0;min-width:0}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title">Application tracker</h1>
      <p class="sub" id="sub" data-i18n="loading">Loading…</p>
    </div>
    <div class="row">
      <div class="lang" id="lang">
        <button type="button" id="lang-btn" class="ghost lang-btn" aria-haspopup="listbox" aria-expanded="false" data-i18n-aria="lang_label" data-i18n-title="lang_label"><span class="flag" id="lang-flag"></span><span id="lang-code">EN</span><svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <ul id="lang-menu" class="lang-menu" role="listbox" hidden></ul>
      </div>
      <span class="chip" id="moteur-etat" data-i18n-title="engine_tip">Engine B: checking…</span>
      <button id="btn-sync" hidden data-i18n="sync">Sync</button>
      <button id="btn-options" class="ghost" aria-haspopup="dialog" data-i18n="options">Options</button>
      <button id="btn-add" class="primary" data-i18n="add">Add</button>
      <button id="btn-import" data-i18n="import" data-i18n-title="import_tip">Import (local engine)</button>
      <button id="btn-export" data-i18n="export">Export</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <div id="msg" hidden></div>

  <section class="panel" id="add-panel" hidden>
    <h2 data-i18n="new_entry">New entry</h2>
    <form id="add-form">
      <div class="grid2">
        <label><span data-i18n="f_type">Type</span>
          <select id="f-type"><option value="spontanee" data-i18n="type_unsolicited">Unsolicited application</option><option value="offre" data-i18n="type_ad">Job ad</option></select>
        </label>
        <label><span data-i18n="f_company">Company</span><input type="text" id="f-entreprise" required></label>
        <label><span data-i18n="f_title">Title or target role</span><input type="text" id="f-poste" data-i18n-placeholder="ph_title" placeholder="Lead AI, Head of AI…"></label>
        <label><span data-i18n="f_location">Location</span><input type="text" id="f-lieu"></label>
        <label><span data-i18n="f_link">Link (ad or website)</span><input type="url" id="f-url" placeholder="https://"></label>
        <label><span data-i18n="f_site_opt">Company website (optional)</span><input type="url" id="f-site" placeholder="https://"></label>
        <label><span data-i18n="f_linkedin_opt">Company LinkedIn (optional)</span><input type="url" id="f-linkedin" placeholder="https://www.linkedin.com/company/…"></label>
        <label><span data-i18n="f_contact">Contact</span><input type="text" id="f-contact" data-i18n-placeholder="ph_contact" placeholder="Name, email, LinkedIn"></label>
        <label><span data-i18n="f_status">Starting status</span>
          <select id="f-statut"></select>
        </label>
      </div>
      <label style="margin-top:10px"><span data-i18n="f_notes">Notes</span><textarea id="f-notes"></textarea></label>
      <label style="margin-top:10px"><span data-i18n="f_text">Ad text</span><textarea id="f-texte" style="min-height:120px"></textarea></label>
      <div class="row" style="margin-top:10px">
        <button class="primary" type="submit" data-i18n="save">Save</button>
        <button type="button" id="add-cancel" class="ghost" data-i18n="cancel">Cancel</button>
      </div>
    </form>
  </section>

  <section class="panel" id="export-panel" hidden>
    <h2 data-i18n="export_title">Export</h2>
    <p class="sub" style="margin:0 0 8px" data-i18n-html="export_hint"></p>
    <textarea class="export" id="export-text" readonly></textarea>
    <div class="row" style="margin-top:8px"><button id="export-copy" data-i18n="copy">Copy</button><button id="export-close" class="ghost" data-i18n="close">Close</button></div>
  </section>

  <dialog class="texte" id="ad-dialog" aria-labelledby="ad-dialog-title">
    <div class="head"><h2 id="ad-dialog-title"></h2><div class="row"><span id="ad-dialog-link"></span><button id="ad-dialog-copy" data-i18n="copy">Copy</button><button id="ad-dialog-close" class="ghost" data-i18n="close">Close</button></div></div>
    <div class="fiche" id="ad-dialog-body"></div>
  </dialog>

  <dialog class="texte" id="opt-dialog" aria-labelledby="opt-dialog-title">
    <div class="head"><h2 id="opt-dialog-title" data-i18n="opt_title">Companies searched</h2><div class="row"><button id="opt-dialog-close" class="ghost" data-i18n="close">Close</button></div></div>
    <div class="fiche opts" id="opt-body"></div>
  </dialog>

  <nav class="pipeline" id="pipeline" data-i18n-aria="steps_aria" aria-label="Steps"></nav>

  <div class="row filters">
    <select id="flt-type" data-i18n-aria="f_type" aria-label="Type">
      <option value="" data-i18n="flt_all_types">Ads and unsolicited</option><option value="offre" data-i18n="flt_ads">Ads</option><option value="spontanee" data-i18n="flt_unsolicited">Unsolicited</option>
    </select>
    <select id="flt-moteur" data-i18n-aria="flt_engine" aria-label="Engine">
      <option value="" data-i18n="flt_all_engines">All engines</option><option value="A" data-i18n="engine_A">Engine A (Claude)</option><option value="B" data-i18n="engine_B">Engine B (PC)</option><option value="manuel" data-i18n="engine_manuel">Manual entry</option>
    </select>
    <input type="text" id="flt-q" data-i18n-placeholder="search_ph" data-i18n-aria="search_aria" placeholder="Search a company, a title" aria-label="Search">
  </div>

  <div class="list" id="list"></div>

  <section class="panel">
    <h2 data-i18n="compare_title">Engine comparison</h2>
    <div class="tablewrap"><table id="stats"></table></div>
    <p class="sub" data-i18n="compare_hint"></p>
  </section>
</div>

<script>

function dateFiche(s){var d=new Date(s);return isNaN(d)?"":d.toLocaleString(locale(),{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});}
// Stored days (YYYY-MM-DD) shown in the interface's language; anything else as is.
function jour(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));if(!m)return String(s||"");return new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).toLocaleDateString(locale(),{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});}
function fiche(d){
  return '<div class="fiche"><div class="row"><span class="sub" style="margin:0">'+esc(d.preparation_le?t("prep_of",{d:dateFiche(d.preparation_le)}):t("prep"))+'</span><button class="ghost" data-act="fiche">'+esc(t("close"))+'</button></div>'+md(d.preparation)+'</div>';
}

function lettreDefaut(d){
  if(d.type==="spontanee"||SOURCES_PUBLIQUES.indexOf(d.source||"")>=0)return true;
  var e="-"+norm(d.entreprise)+"-";
  return MOTS_LETTRE.some(function(m){var c=norm(m);return c&&e.indexOf("-"+c+"-")>=0;});
}
function lettrePrevue(d){if(d.lettre==="oui")return true;if(d.lettre==="non")return false;return !!d.lettre_demandee||lettreDefaut(d);}
function lettreBouton(d){
  // Once the letter is made, the "Letter" link replaces the toggle.
  if(d.lettre_ref||["a_traiter","acceptee","prete","validee"].indexOf(d.statut)<0)return "";
  var on=lettrePrevue(d);
  return '<button class="lettre" data-act="lettre" aria-pressed="'+on+'" title="'+esc((d.lettre_demandee?t("letter_asked_tip"):"")+t("click_change"))+'">'+esc(t("letter_toggle",{v:t(on?"yes":"no")}))+'</button>';
}
function label(id){return STATUTS.indexOf(id)>=0?t("status_"+id):id;}

// The last message is kept as a key, so that it follows a change of language.
function say(key,params,kind){
  if(typeof params==="string"){kind=params;params=null;}
  state.msg=key?{key:key,params:params,kind:kind||""}:null;showMsg();
}
function showMsg(){var m=$("msg"),s=state.msg;if(!s){m.hidden=true;return;}m.hidden=false;m.className="note"+(s.kind?" "+s.kind:"");m.textContent=t(s.key,s.params);}
function code(e){return (e&&e.code)||t("error");}

function write(id,fields){
  if(!col)return Promise.reject(new Error("unavailable"));
  fields.date_maj=today();
  return col.doc(id).update(fields).catch(function(e){say("save_failed",{code:code(e)},"bad");throw e;});
}

function filtered(){
  var ty=$("flt-type").value,m=$("flt-moteur").value,q=norm($("flt-q").value);
  return state.docs.filter(function(d){
    if(ty&&d.type!==ty)return false;
    if(m&&(d.moteur||"manuel")!==m)return false;
    if(q&&norm((d.entreprise||"")+" "+(d.poste||"")+" "+(d.lieu||"")).indexOf(q)<0)return false;
    return true;
  });
}

function renderPipeline(list){
  var html="";
  STATUTS.forEach(function(s){
    var n=list.filter(function(d){return d.statut===s;}).length;
    html+='<button class="stage" data-tab="'+s+'" aria-pressed="'+(state.tab===s)+'"><span class="n">'+n+'</span><span class="l">'+esc(label(s))+'</span></button>';
  });
  $("pipeline").innerHTML=html;
}

function actions(d){
  var a="";
  if(d.statut==="a_traiter")a='<button class="yes" data-act="oui">'+esc(t("act_yes"))+'</button><button class="no" data-act="non">'+esc(t("act_no"))+'</button>';
  else if(d.statut==="acceptee")a='<span class="chip">'+esc(t(lettrePrevue(d)?"chip_cv_letter":"chip_cv"))+'</span>';
  else if(d.statut==="prete")a='<button class="yes" data-act="valider">'+esc(t("act_validate"))+'</button>';
  else if(d.statut==="validee")a='<button class="primary" data-act="postulee">'+esc(t("act_applied"))+'</button>';
  else if(d.statut==="refusee")a='<button data-act="rouvrir">'+esc(t("act_reopen"))+'</button>';
  return a;
}

function motifPicker(d){
  var h='<div class="detail motifs"><div class="sub" style="margin:0">'+esc(t("why_reject"))+'</div><div class="row">';
  MOTIFS.forEach(function(m){h+='<button data-act="motif" data-motif="'+m+'">'+esc(motifLabel(m))+'</button>';});
  h+='</div><label>'+esc(t("reason_detail"))+'<input type="text" id="i-motif-detail" maxlength="200" placeholder="'+esc(t("reason_ph"))+'"></label>';
  h+='<div class="row"><button class="ghost" data-act="motif" data-motif="">'+esc(t("reject_no_reason"))+'</button><button class="ghost" data-act="motif-annuler">'+esc(t("cancel"))+'</button></div></div>';
  return h;
}

function field(id,key,labKey,d,type){
  var v=state.drafts[id]&&state.drafts[id][key]!=null?state.drafts[id][key]:(d[key]||""),lab=esc(t(labKey));
  if(type==="area")return '<label>'+lab+'<textarea data-f="'+key+'" id="i-'+key+'">'+esc(v)+'</textarea></label>';
  return '<label>'+lab+'<input type="text" data-f="'+key+'" id="i-'+key+'" value="'+esc(v)+'"></label>';
}

function detail(d){
  var h='<div class="detail">';
  if(d.resume)h+='<p class="resume">'+esc(d.resume)+'</p>';
  var liens=liensEntreprise(d);
  if(liens)h+='<div class="liens">'+liens+'</div>';
  if(d.consigne&&d.statut==="acceptee")h+='<div class="note">'+esc(t("pending_instr"))+esc(d.consigne)+'</div>';
  if(docLinks(d))h+='<p class="sub" style="margin:0">'+t("pdf_hint")+'</p>';
  h+='<div class="grid2">'+field(d.id,"cv_ref","fld_cv",d)+field(d.id,"lettre_ref","fld_letter",d)+field(d.id,"contact","f_contact",d)+field(d.id,"site_entreprise","link_site",d)+field(d.id,"linkedin_entreprise","link_linkedin",d)+'</div>';
  h+=field(d.id,"notes","f_notes",d,"area");
  if(d.type!=="spontanee"){
    if(d.statut==="acceptee"&&!String(d.texte_offre||"").trim()&&(d.moteur||"manuel")!=="B")h+='<div class="note">'+esc(t("missing_text"))+'</div>';
    h+=field(d.id,"texte_offre","fld_ad_text",d,"area");
  }
  if(d.statut==="prete"||d.statut==="validee")h+=field(d.id,"consigne","fld_edit",d,"area");
  if(d.lettre_ref&&(d.statut==="prete"||d.statut==="validee")){
    if(d.lettre_refaire_le)h+='<div class="note">'+esc(t("letter_redo"))+(d.lettre_consigne?esc(t("letter_redo_instr",{v:d.lettre_consigne})):"")+'. '+t(moteur.ok?"letter_redo_ok":"letter_redo_off")+esc(t("letter_redo_end"))+'</div>';
    h+=field(d.id,"lettre_consigne","fld_letter_instr",d,"area");
  }
  if(d.statut==="refusee"){
    h+='<div class="grid2"><label>'+esc(t("fld_reason"))+'<select data-motif-sel="1">';
    var connu=MOTIFS.indexOf(d.motif_refus)>=0;
    h+='<option value=""'+(d.motif_refus?"":" selected")+'>'+esc(t("reason_none"))+'</option>';
    MOTIFS.forEach(function(m){h+='<option value="'+m+'"'+((d.motif_refus===m||(m==="autre"&&d.motif_refus&&!connu))?" selected":"")+'>'+esc(motifLabel(m))+'</option>';});
    h+='</select></label>'+field(d.id,"motif_detail","fld_reason_detail",d)+'</div>';
  }
  if(d.statut==="postulee"){
    h+='<label style="max-width:260px">'+esc(t("fld_suite"))+'<select data-suite="1" id="i-suite">';
    SUITES.forEach(function(s){h+='<option value="'+s+'"'+((d.suite||"")===s?" selected":"")+'>'+esc(t("suite_"+s))+'</option>';});
    h+='</select></label>';
  }
  if(prepPossible(d)){
    h+='<div class="sub" style="margin:0">'+esc(t("prep_intro"))+'</div>';
    h+='<div class="grid2">'+field(d.id,"pretentions","fld_salary",d)+field(d.id,"entretien_infos","fld_interview",d)+'</div>';
    h+=field(d.id,"preparation_consigne","fld_prep_instr",d,"area");
    if(prepEnCours(d))h+='<div class="note">'+esc(t("prep_requested"))+(moteur.ok?esc(t("prep_req_ok")):t("prep_req_off"))+'</div>';
  }
  h+='<div class="row"><button data-act="save">'+esc(t("act_save"))+'</button>';
  if(prepPossible(d))h+='<button class="primary" data-act="preparer">'+esc(t(d.preparation?"act_prep_redo":"act_prep"))+'</button>';
  if(d.statut==="acceptee")h+='<button data-act="pret">'+esc(t("act_ready"))+'</button>';
  if(d.statut==="prete"||d.statut==="validee")h+='<button data-act="retouche">'+esc(t("act_retouch"))+'</button>';
  if(d.lettre_ref&&(d.statut==="prete"||d.statut==="validee"))h+='<button data-act="relettre">'+esc(t("act_reletter"))+'</button>';
  if(d.statut!=="refusee"&&d.statut!=="a_traiter")h+='<button class="ghost" data-act="non">'+esc(t("act_drop"))+'</button>';
  h+=state.confirmDel===d.id?'<button class="no" data-act="del2">'+esc(t("act_del_confirm"))+'</button>':'<button class="ghost" data-act="del">'+esc(t("act_del"))+'</button>';
  h+='</div></div>';
  return h;
}

function renderList(list){
  var rows=list.filter(function(d){return d.statut===state.tab;});
  rows.sort(function(a,b){
    if(state.tab==="a_traiter")return (b.score||0)-(a.score||0);
    return String(b.date_maj||"").localeCompare(String(a.date_maj||""));
  });
  if(!state.loaded){$("list").innerHTML='<div class="empty">'+esc(t("list_loading"))+'</div>';return;}
  if(!rows.length){
    $("list").innerHTML='<div class="empty">'+esc(t(state.docs.length?"list_empty_filter":"list_empty"))+'</div>';
    return;
  }
  var html="";
  rows.forEach(function(d){
    var sp=d.type==="spontanee";
    html+='<article class="card '+(sp?"t-spontanee":"t-offre")+'" data-id="'+esc(d.id)+'"><div class="head"><div>';
    html+='<button class="title" data-act="toggle" aria-expanded="'+(state.open===d.id)+'">'+esc(d.entreprise||t("unknown_company"))+(d.poste?" · "+esc(d.poste):"")+'</button>';
    html+='<div class="meta"><span class="chip '+(sp?"spont":"offre")+'">'+esc(t(sp?"chip_unsolicited":"chip_ad"))+'</span>';
    html+='<span class="chip">'+esc(moteurLabel(d.moteur))+'</span>';
    if(d.score!=null&&d.score!=="")html+='<span class="score">'+esc(t("score",{n:d.score}))+'</span>';
    if(d.lieu)html+='<span>'+esc(d.lieu)+'</span>';
    if(d.lettre_demandee)html+='<span class="chip">'+esc(t("chip_letter_asked"))+'</span>';
    if(d.lettre_ref&&d.lettre_refaire_le)html+='<span class="chip warn">'+esc(t("chip_letter_redo"))+'</span>';
    if((d.statut==="prete"||d.statut==="validee")&&lettrePrevue(d)&&!d.lettre_ref)html+='<span class="chip warn">'+esc(t("chip_letter_gen"))+'</span>';
    if(d.statut==="postulee"){
      html+='<span>'+esc(t("sent_on",{d:jour(d.date_postulee||d.date_maj||"")}))+'</span>';
      if(d.suite==="entretien"||d.suite==="offre")html+='<span class="chip ok">'+esc(t(d.suite==="offre"?"chip_offer":"chip_interview"))+'</span>';
      if(d.suite==="refus")html+='<span class="chip bad">'+esc(t("chip_refused"))+'</span>';
      if(d.suite==="relance")html+='<span class="chip">'+esc(t("chip_followed"))+'</span>';
      if(prepEnCours(d))html+='<span class="chip warn">'+esc(t("chip_prep"))+'</span>';
    } else if(d.date_ajout)html+='<span>'+esc(t("added_on",{d:jour(d.date_ajout)}))+'</span>';
    if(d.statut==="refusee"&&d.motif_refus)html+='<span class="chip bad">'+esc(motifLabel(d.motif_refus))+(d.motif_detail?" · "+esc(d.motif_detail):"")+'</span>';
    if(String(d.texte_offre||"").trim())html+='<button class="mini" data-act="texte-offre">'+esc(t("ad_text_view"))+'</button>';
    html+='</div></div><div class="row">'+docLinks(d)+lettreBouton(d)+actions(d)+'</div></div>';
    if(state.refusing===d.id)html+=motifPicker(d);
    if(state.fiche===d.id&&d.preparation)html+=fiche(d);
    if(state.open===d.id)html+=detail(d);
    html+='</article>';
  });
  $("list").innerHTML=html;
}

function renderStats(){
  var acc=["acceptee","prete","validee","postulee"];
  var h='<tr>'+["th_engine","th_proposed","th_review","th_accepted","th_rejected","th_applied","th_rate"].map(function(k){return '<th>'+esc(t(k))+'</th>';}).join("")+'</tr>';
  MOTEURS.forEach(function(m){
    var ds=state.docs.filter(function(d){return (d.moteur||"manuel")===m;});
    var a=ds.filter(function(d){return acc.indexOf(d.statut)>=0;}).length;
    var r=ds.filter(function(d){return d.statut==="refusee";}).length;
    var p=ds.filter(function(d){return d.statut==="postulee";}).length;
    var w=ds.filter(function(d){return d.statut==="a_traiter";}).length;
    h+='<tr><td>'+esc(moteurLabel(m))+'</td><td class="num">'+ds.length+'</td><td class="num">'+w+'</td><td class="num">'+a+'</td><td class="num">'+r+'</td><td class="num">'+p+'</td><td class="num">'+((a+r)?esc(t("percent",{n:Math.round(100*a/(a+r))})):"–")+'</td></tr>';
  });
  $("stats").innerHTML=h;
}

function render(){
  var list=filtered();
  renderPipeline(list);renderList(list);renderStats();
  if(state.loaded){
    var sp=state.docs.filter(function(d){return d.type==="spontanee";}).length;
    $("sub").textContent=tp("sub",sp,{n:state.docs.length,s:sp});
  }
}

// Static texts of the page (PAGE-66): every element carrying a data-i18n* attribute.
function applyStatic(){
  document.documentElement.lang=lang;
  document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.getAttribute("data-i18n"));});
  document.querySelectorAll("[data-i18n-html]").forEach(function(el){el.innerHTML=t(el.getAttribute("data-i18n-html"));});
  document.querySelectorAll("[data-i18n-placeholder]").forEach(function(el){el.placeholder=t(el.getAttribute("data-i18n-placeholder"));});
  document.querySelectorAll("[data-i18n-title]").forEach(function(el){el.title=t(el.getAttribute("data-i18n-title"));});
  document.querySelectorAll("[data-i18n-aria]").forEach(function(el){el.setAttribute("aria-label",t(el.getAttribute("data-i18n-aria")));});
  var v=$("f-statut").value||"postulee",h="";
  STATUTS.forEach(function(s){h+='<option value="'+s+'">'+esc(label(s))+'</option>';});
  $("f-statut").innerHTML=h;$("f-statut").value=v;
  renderLangPicker();
}

// Language menu (PAGE-63): current flag in the header, the list of languages on click.
function renderLangPicker(){
  var cur=langInfo(lang);
  $("lang-flag").innerHTML=cur.flag("b");
  $("lang-code").textContent=cur.code.toUpperCase();
  $("lang-menu").innerHTML=LANGS.map(function(l,i){
    return '<li role="option" tabindex="-1" data-lang="'+l.code+'" aria-selected="'+(l.code===lang)+'" lang="'+l.code+'"><span class="flag">'+l.flag("m"+i)+'</span>'+esc(l.name)+'</li>';
  }).join("");
}
function openLangMenu(open){
  $("lang-menu").hidden=!open;$("lang-btn").setAttribute("aria-expanded",String(open));
  if(open){var sel=$("lang-menu").querySelector('[aria-selected="true"]');if(sel)sel.focus();}
}
function saveLang(){
  if(!db){langPending=true;return;}
  langPending=false;
  db.doc("reglages/page").set({langue:lang}).catch(function(){say("lang_not_saved","bad");});
}
function setLang(c,save){
  c=knownLang(c);
  var changed=c!==lang;lang=c;
  try{localStorage.setItem(LANG_KEY,c);}catch(_){}
  if(changed){applyStatic();render();afficherMoteur();showMsg();if($("opt-dialog").open)rendreOptions();}
  if(save)saveLang();
}
$("lang-btn").addEventListener("click",function(e){e.stopPropagation();openLangMenu($("lang-menu").hidden);});
$("lang-menu").addEventListener("click",function(e){
  var li=e.target.closest("[data-lang]");if(!li)return;
  openLangMenu(false);$("lang-btn").focus();
  if(li.getAttribute("data-lang")!==lang)setLang(li.getAttribute("data-lang"),true);
});
$("lang-menu").addEventListener("keydown",function(e){
  var items=Array.prototype.slice.call($("lang-menu").querySelectorAll("[data-lang]")),i=items.indexOf(document.activeElement);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();var n=items[(i+(e.key==="ArrowDown"?1:items.length-1))%items.length];if(n)n.focus();}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();if(items[i])items[i].click();}
  else if(e.key==="Escape"||e.key==="Tab"){openLangMenu(false);if(e.key==="Escape")$("lang-btn").focus();}
});
document.addEventListener("click",function(e){if(!$("lang-menu").hidden&&!e.target.closest("#lang"))openLangMenu(false);});

function collectDraft(card){
  var o={};
  card.querySelectorAll("[data-f]").forEach(function(el){o[el.getAttribute("data-f")]=el.value;});
  return o;
}

$("list").addEventListener("input",function(e){
  var card=e.target.closest(".card");if(!card||!e.target.hasAttribute("data-f"))return;
  var id=card.getAttribute("data-id");
  state.drafts[id]=state.drafts[id]||{};state.drafts[id][e.target.getAttribute("data-f")]=e.target.value;
});
$("list").addEventListener("change",function(e){
  var card=e.target.closest(".card");if(!card)return;
  if(e.target.hasAttribute("data-suite"))write(card.getAttribute("data-id"),{suite:e.target.value});
  else if(e.target.hasAttribute("data-motif-sel"))write(card.getAttribute("data-id"),{motif_refus:e.target.value});
});
$("list").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var card=b.closest(".card"),id=card.getAttribute("data-id"),act=b.getAttribute("data-act");
  var draft=state.open===id?collectDraft(card):{};
  var done=function(){delete state.drafts[id];};
  if(act==="toggle"){state.open=state.open===id?null:id;state.confirmDel=null;render();return;}
  if(act==="del"){state.confirmDel=id;render();return;}
  if(act==="fiche"){state.fiche=state.fiche===id?null:id;render();return;}
  if(act==="texte-offre"){ouvrirTexteOffre(id);return;}
  // "No" and "Drop" first ask for the reason (PAGE-10).
  if(act==="non"){state.refusing=state.refusing===id?null:id;render();return;}
  if(act==="motif-annuler"){state.refusing=null;render();return;}
  if(act==="del2"){col.doc(id).delete().then(function(){state.open=null;state.confirmDel=null;}).catch(function(){say("delete_failed","bad");});return;}
  b.disabled=true;
  var f=draft;
  // PAGE-42: a changed company link becomes User's correction; both emptied = none.
  if("site_entreprise" in f||"linkedin_entreprise" in f){
    var doc=state.docs.filter(function(x){return x.id===id;})[0]||{};
    var saisis=liensSaisis({site_entreprise:f.site_entreprise,linkedin_entreprise:f.linkedin_entreprise});
    if(!saisis){b.disabled=false;return;}
    if(saisis.site_entreprise!==(doc.site_entreprise||"")||saisis.linkedin_entreprise!==(doc.linkedin_entreprise||"")){
      f.site_entreprise=saisis.site_entreprise;f.linkedin_entreprise=saisis.linkedin_entreprise;
      f.liens_manuels=!!(saisis.site_entreprise||saisis.linkedin_entreprise);
    }else{delete f.site_entreprise;delete f.linkedin_entreprise;}
  }
  if(act==="lettre"){write(id,{lettre:lettrePrevue(state.docs.filter(function(x){return x.id===id;})[0]||{})?"non":"oui"}).then(function(){say(null);}).catch(function(){b.disabled=false;});return;}
  if(act==="oui")f.statut="acceptee";
  else if(act==="motif"){
    var precision=card.querySelector("#i-motif-detail");
    f.statut="refusee";f.motif_refus=b.getAttribute("data-motif")||"";
    f.motif_detail=f.motif_refus&&precision?precision.value.trim().slice(0,200):"";
    state.refusing=null;
  }
  else if(act==="rouvrir"){f.statut="a_traiter";f.motif_refus="";f.motif_detail="";}
  else if(act==="pret")f.statut="prete";
  else if(act==="valider")f.statut="validee";
  else if(act==="postulee"){f.statut="postulee";f.date_postulee=today();}
  else if(act==="preparer"){
    f.preparation_demandee_le=new Date().toISOString();
    ["pretentions","entretien_infos","preparation_consigne"].forEach(function(k){if(f[k]!=null)f[k]=String(f[k]).trim().slice(0,2000);});
  }
  else if(act==="relettre"){f.lettre_refaire_le=new Date().toISOString();f.lettre_consigne=String(f.lettre_consigne||"").trim();}
  else if(act==="retouche"){
    if(!String(f.consigne||"").trim()){say("retouch_first","bad");b.disabled=false;return;}
    f.statut="acceptee";f.retouche_le=new Date().toISOString();
  }
  write(id,f).then(function(){done();say(null);}).catch(function(){b.disabled=false;});
});

$("pipeline").addEventListener("click",function(e){
  var b=e.target.closest("[data-tab]");if(!b)return;
  state.tab=b.getAttribute("data-tab");state.open=null;render();
});
["flt-type","flt-moteur"].forEach(function(id){$(id).addEventListener("change",render);});
$("flt-q").addEventListener("input",render);

$("btn-add").addEventListener("click",function(){$("add-panel").hidden=!$("add-panel").hidden;if(!$("add-panel").hidden)$("f-entreprise").focus();});
$("add-cancel").addEventListener("click",function(){$("add-panel").hidden=true;});
$("add-form").addEventListener("submit",function(e){
  e.preventDefault();
  if(!col){say("db_unavailable","bad");return;}
  var d={type:$("f-type").value,entreprise:$("f-entreprise").value.trim(),poste:$("f-poste").value.trim(),lieu:$("f-lieu").value.trim(),
    url:safeUrl($("f-url").value),contact:$("f-contact").value.trim(),statut:$("f-statut").value,notes:$("f-notes").value.trim(),texte_offre:$("f-texte").value.trim().slice(0,20000),
    moteur:"manuel",date_ajout:today(),date_maj:today()};
  if(d.statut==="postulee")d.date_postulee=today();
  var liens=liensSaisis({site_entreprise:$("f-site").value,linkedin_entreprise:$("f-linkedin").value});
  if(!liens)return;
  if(liens.site_entreprise||liens.linkedin_entreprise){d.site_entreprise=liens.site_entreprise;d.linkedin_entreprise=liens.linkedin_entreprise;d.liens_manuels=true;}
  var id=keyOf(d);
  if(state.docs.some(function(x){return x.id===id;})){say("dup_entry","bad");return;}
  col.doc(id).set(d).then(function(){
    $("add-form").reset();$("f-statut").value="postulee";$("add-panel").hidden=true;state.tab=d.statut;say("entry_added","ok");render();
  }).catch(function(e){say("add_failed",{code:code(e)},"bad");});
});

$("btn-import").addEventListener("click",function(){$("file").click();});
$("file").addEventListener("change",function(){
  var f=$("file").files[0];if(!f)return;
  lireFichier(f);$("file").value="";
});
function importRows(arr,auto){
  if(!col){if(!auto)say("db_unavailable","bad");return Promise.resolve();}
  var known={};state.docs.forEach(function(d){known[d.id]=d;});
  var added=0,updated=0,skipped=0,chain=Promise.resolve();
  var LIENS=["site_entreprise","linkedin_entreprise"];
  var GEN=["cv_ref","lettre_ref","resume","score","lettre_demandee","preparation","preparation_le"];
  arr.forEach(function(raw){
    if(!raw||typeof raw!=="object"||!raw.entreprise){skipped++;return;}
    var d={type:raw.type==="spontanee"?"spontanee":"offre",entreprise:String(raw.entreprise),poste:String(raw.poste||""),lieu:String(raw.lieu||""),
      url:safeUrl(raw.url),source:String(raw.source||""),moteur:raw.moteur==="A"?"A":"B",resume:String(raw.resume||"").slice(0,4000),
      lettre_demandee:!!raw.lettre_demandee,date_ajout:today(),date_maj:today(),statut:"a_traiter"};
    if(raw.score!=null&&!isNaN(Number(raw.score)))d.score=Number(raw.score);
    if(raw.contact)d.contact=String(raw.contact);
    LIENS.forEach(function(k){var v=safeUrl(raw[k]);if(v)d[k]=v;});
    var id=raw.id?norm(raw.id).slice(0,150):keyOf(d),ex=known[id];
    var texte=typeof raw.texte_offre==="string"?raw.texte_offre.trim().slice(0,20000):"";
    // An archived application (ECH-06) only fills in a missing ad text, never creates one.
    if(raw.archive){
      if(ex&&texte&&!String(ex.texte_offre||"").trim()){chain=chain.then(function(){return col.doc(id).update({texte_offre:texte}).then(function(){updated++;});});}
      else skipped++;
      return;
    }
    if(texte)d.texte_offre=texte;
    if(!ex){
      known[id]=d;
      chain=chain.then(function(){return col.doc(id).set(d).then(function(){added++;});});
      return;
    }
    var up={};
    GEN.forEach(function(k){if(raw[k]!=null&&raw[k]!==""&&raw[k]!==ex[k])up[k]=k==="score"?Number(raw[k]):raw[k];});
    // The engine's company links never replace User's correction (PAGE-31, PAGE-42).
    // The ad text is kept: the engine's only fills in a missing one (PAGE-31, BASE-14).
    if(texte&&!String(ex.texte_offre||"").trim())up.texte_offre=texte;
    if(!ex.liens_manuels)LIENS.forEach(function(k){var v=safeUrl(raw[k]);if(v&&v!==ex[k])up[k]=v;});
    // A folder being edited only goes back to validation if the engine regenerated it since.
    var regenere=!ex.retouche_le||(raw.genere_le&&String(raw.genere_le)>String(ex.retouche_le));
    if(raw.cv_ref&&ex.statut==="acceptee"&&regenere){up.statut="prete";up.consigne="";}
    // A letter regeneration request is served as soon as a more recent PDF arrives.
    if(ex.lettre_refaire_le&&raw.lettre_generee_le&&String(raw.lettre_generee_le)>String(ex.lettre_refaire_le)){up.lettre_refaire_le="";up.lettre_consigne="";}
    // Filling in the ad text alone is not a change of User's: the order of the lists stays.
    if(Object.keys(up).length){if(Object.keys(up).some(function(k){return k!=="texte_offre";}))up.date_maj=today();chain=chain.then(function(){return col.doc(id).update(up).then(function(){updated++;});});}
    else skipped++;
  });
  return chain.then(function(){
    if(auto&&!added&&!updated)return;
    say(auto?"import_auto":"import_done",{a:added,u:updated,s:skipped},"ok");
  }).catch(function(e){say("import_broken",{code:code(e),a:added},"bad");});
}

// The platform blocks fetch() to 127.0.0.1: import goes through a chosen or dropped file.
function lireFichier(f){
  var r=new FileReader();
  r.onload=function(){
    var arr;
    try{arr=JSON.parse(r.result);if(arr&&arr.candidatures)arr=arr.candidatures;if(!Array.isArray(arr))throw 0;}
    catch(_){say("bad_file","bad");return;}
    importRows(arr);
  };
  r.readAsText(f);
}
document.addEventListener("dragover",function(e){if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],"Files")>=0){e.preventDefault();document.body.classList.add("depot");}});
document.addEventListener("dragleave",function(e){if(!e.relatedTarget)document.body.classList.remove("depot");});
document.addEventListener("drop",function(e){
  document.body.classList.remove("depot");
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;
  e.preventDefault();lireFichier(f);
});

// Companies searched (PAGE-70 to PAGE-74): the choices live in engine B, never in the page.
var opts={data:null,busy:false,err:null,q:"",reset:false};
function raisonMoteur(e){
  var c=e&&e.code;
  if(c==="server_not_connected"||c==="capability_disabled"||c==="not_granted")return t("eng_err_stopped");
  if(c==="not_in_manifest"||c==="cancelled"||c==="approval_required")return t("eng_err_refused");
  return t("eng_err_other",{code:c||(e&&e.message)||t("unknown")});
}
function appelOptions(outil,entree){
  return moteur.mcp.callTool(SRV,outil,entree,{cache:false}).then(function(r){
    var p=r&&r.payload;
    if(!p||(r.isError||r.is_error)||!Array.isArray(p.entreprises))throw {code:"reponse_illisible"};
    return p;
  });
}
function cleTrad(k){return String(k).replace(/-/g,"_");}
function secteurLabel(k){return k?t("sec_"+cleTrad(k)):t("opt_no_sector");}
function tailleLabel(k){return t("size_"+cleTrad(k));}
function caseHtml(attrs,checked,label,off,disabled){
  return '<label class="tick'+(off?" off":"")+'"><input type="checkbox" '+attrs+(checked?" checked":"")+(disabled?" disabled":"")+'> '+label+'</label>';
}
function lienDefaut(attrs){return ' <button type="button" class="mini" '+attrs+'>'+esc(t("opt_default"))+'</button>';}
function ouvrirOptions(){
  opts.err=null;opts.reset=false;
  var dlg=$("opt-dialog");if(dlg.showModal){if(!dlg.open)dlg.showModal();}else dlg.setAttribute("open","");
  if(!moteur.mcp){opts.data=null;rendreOptions();return;}
  opts.busy=true;rendreOptions();
  appelOptions("entreprises",{}).then(function(p){opts.data=p;opts.err=null;})
    .catch(function(e){opts.err=t("opt_read_failed",{why:raisonMoteur(e)});})
    .then(function(){opts.busy=false;rendreOptions();});
}
function rendreOptions(){
  var b=$("opt-body");
  if(!moteur.mcp){b.innerHTML='<p class="note">'+esc(t("opt_need_engine"))+'</p>';return;}
  if(!opts.data){b.innerHTML=opts.err?'<p class="note bad">'+esc(opts.err)+'</p>':'<p class="sub">'+esc(t("opt_loading"))+'</p>';return;}
  var d=opts.data,h='<p class="sub" style="margin:0">'+esc(t("opt_scope"))+'</p>';
  if(opts.err)h+='<p class="note bad" role="alert">'+esc(opts.err)+'</p>';
  h+='<fieldset'+(opts.busy?" disabled":"")+'>';
  var tailles={};d.tailles.forEach(function(x){tailles[x.cle]=x.actif;});
  h+='<h3>'+esc(t("opt_sources"))+'</h3><div class="grp">';
  d.sources.forEach(function(s){
    var note=!s.configuree?t("opt_not_configured"):(s.actif&&!s.recherchee?t("opt_off_by_size"):"");
    h+='<span>'+caseHtml('data-obj="source" data-cle="'+esc(s.cle)+'"',s.configuree&&s.actif,esc(s.nom)+(note?' <span class="count">('+esc(note)+')</span>':""),!s.recherchee,!s.configuree);
    if(!s.actif)h+=lienDefaut('data-def="source" data-cle="'+esc(s.cle)+'"');
    h+='</span>';
  });
  h+='</div><h3>'+esc(t("opt_sizes"))+'</h3><div class="grp">';
  d.tailles.forEach(function(x){
    h+='<span>'+caseHtml('data-obj="taille" data-cle="'+esc(x.cle)+'"',x.actif,esc(tailleLabel(x.cle))+' <span class="count">'+x.entreprises+'</span>',!x.actif);
    if(!x.actif)h+=lienDefaut('data-def="taille" data-cle="'+esc(x.cle)+'"');
    h+='</span>';
  });
  h+='</div><h3>'+esc(t("opt_sectors"))+'</h3><div class="grp">';
  d.secteurs.filter(function(x){return x.entreprises>0;}).forEach(function(x){
    h+='<span>'+caseHtml('data-obj="secteur" data-cle="'+esc(x.cle)+'"',x.actif,esc(secteurLabel(x.cle))+' <span class="count">'+x.entreprises+'</span>',!x.actif);
    if(!x.actif)h+=lienDefaut('data-def="secteur" data-cle="'+esc(x.cle)+'"');
    h+='</span>';
  });
  h+='</div><h3>'+esc(t("opt_companies"))+'</h3>';
  h+='<input type="text" id="opt-q" value="'+esc(opts.q)+'" placeholder="'+esc(t("opt_search_ph"))+'" aria-label="'+esc(t("opt_search_aria"))+'">';
  h+='<div id="opt-list"></div>';
  h+='<div class="row" style="margin-top:14px">'+(opts.reset?'<button type="button" class="no" id="opt-reset2">'+esc(t("opt_reset_confirm"))+'</button>':'<button type="button" class="ghost" id="opt-reset">'+esc(t("opt_reset"))+'</button>')+'</div>';
  h+='</fieldset>';
  b.innerHTML=h;rendreListeOptions();
}
function rendreListeOptions(){
  var l=$("opt-list");if(!l||!opts.data)return;
  var q=norm(opts.q),ordre=opts.data.secteurs.map(function(x){return x.cle;}).concat([""]),groupes={};
  opts.data.entreprises.forEach(function(c){
    if(q&&norm(c.nom).indexOf(q)<0)return;
    (groupes[c.secteur||""]=groupes[c.secteur||""]||[]).push(c);
  });
  var h="";
  ordre.forEach(function(s){
    var g=groupes[s];if(!g)return;
    g.sort(function(a,b){return a.nom.localeCompare(b.nom,locale());});
    h+='<div class="sector">'+esc(secteurLabel(s))+' <span class="count">'+esc(tp("opt_count",g.length,{n:g.length}))+'</span></div>';
    g.forEach(function(c){
      var gris=c.actif&&!c.recherchee,why=gris?t("opt_reason_"+c.raison):(!c.actif&&c.raison==="pays"?t("opt_reason_pays"):"");
      h+='<div class="co'+(c.recherchee?"":" dim")+'"><span class="name">'+esc(c.nom)+' <span class="chip">'+esc(t("opt_badge_"+(c.origine==="catalogue"?"catalogue":"perso")))+'</span>'+(why?' <span class="why">'+esc(why)+'</span>':"")+'</span>';
      h+=caseHtml('data-obj="entreprise" data-champ="actif" data-cle="'+esc(c.cle)+'"',c.actif,esc(t("opt_searched")),!c.recherchee);
      h+=caseHtml('data-obj="entreprise" data-champ="spontanee" data-cle="'+esc(c.cle)+'"',c.spontanee,esc(t("opt_unsolicited")),!c.spontanee);
      if(c.actif!==c.actif_par_defaut||c.spontanee!==c.spontanee_par_defaut)h+=lienDefaut('data-def="entreprise" data-cle="'+esc(c.cle)+'"');
      h+='</div>';
    });
  });
  l.innerHTML=h||'<p class="sub">'+esc(t("opt_none"))+'</p>';
}
// Each tick goes to engine B at once; the panel is redrawn from its answer (PAGE-72).
function choisir(choix){
  if(!moteur.mcp||opts.busy)return;
  opts.busy=true;opts.err=null;rendreOptions();
  appelOptions("selection",{choix:choix}).then(function(p){opts.data=p;})
    .catch(function(e){opts.err=t("opt_failed",{why:raisonMoteur(e)});})
    .then(function(){opts.busy=false;rendreOptions();});
}
$("btn-options").addEventListener("click",ouvrirOptions);
$("opt-dialog-close").addEventListener("click",function(){var dlg=$("opt-dialog");if(dlg.close)dlg.close();else dlg.removeAttribute("open");});
$("opt-dialog").addEventListener("click",function(e){if(e.target===this&&this.close)this.close();});
$("opt-body").addEventListener("input",function(e){if(e.target.id==="opt-q"){opts.q=e.target.value;rendreListeOptions();}});
$("opt-body").addEventListener("change",function(e){
  var el=e.target;if(el.type!=="checkbox"||!el.hasAttribute("data-obj"))return;
  var c={objet:el.getAttribute("data-obj"),cle:el.getAttribute("data-cle")};
  c[el.getAttribute("data-champ")||"actif"]=el.checked;
  choisir([c]);
});
$("opt-body").addEventListener("click",function(e){
  var el=e.target.closest("button");if(!el)return;
  if(el.hasAttribute("data-def")){
    var c={objet:el.getAttribute("data-def"),cle:el.getAttribute("data-cle"),actif:null};
    if(c.objet==="entreprise")c.spontanee=null;
    choisir([c]);return;
  }
  if(el.id==="opt-reset"){opts.reset=true;rendreOptions();return;}
  if(el.id==="opt-reset2"){
    opts.reset=false;var d=opts.data,choix=[];
    d.entreprises.forEach(function(c){if(c.actif!==c.actif_par_defaut||c.spontanee!==c.spontanee_par_defaut)choix.push({objet:"entreprise",cle:c.cle,actif:null,spontanee:null});});
    [["secteur",d.secteurs],["taille",d.tailles],["source",d.sources]].forEach(function(g){g[1].forEach(function(x){if(!x.actif)choix.push({objet:g[0],cle:x.cle,actif:null});});});
    if(choix.length)choisir(choix);else rendreOptions();
  }
});

function heure(d){return d.toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"});}
// The engine's state is kept as codes and worded at display time, in the current language.
function afficherMoteur(){
  var c=$("moteur-etat");
  if(moteur.ok){c.className="chip ok";c.textContent=t("eng_connected")+(moteur.derniere?t("eng_sync",{t:heure(moteur.derniere)}):"");}
  else if(!moteur.vu&&!state.loaded){c.className="chip";c.textContent=t("engine_searching");}
  else{var e=moteur.erreur;c.className="chip"+(e?" warn":"");c.textContent=t("eng_not")+(e?" ("+(e.key==="eng_err_other"?t(e.key,{code:e.code||t("unknown")}):t(e.key))+")":"");}
  $("btn-sync").hidden=!moteur.mcp;
}
function echecMoteur(e){
  var c=e&&e.code;moteur.ok=false;
  if(c==="server_not_connected"||c==="capability_disabled"||c==="not_granted")moteur.erreur={key:"eng_err_stopped"};
  else if(c==="not_in_manifest"||c==="cancelled"||c==="approval_required"){moteur.refus=true;moteur.erreur={key:"eng_err_refused"};}
  else moteur.erreur={key:"eng_err_other",code:c};
  afficherMoteur();
}
// Only the fields the engine reads (ECH-11); the ad text is sent whatever the status (BASE-14).
var CHAMPS_MOTEUR=["id","statut","consigne","lettre_demandee","lettre","lettre_refaire_le","lettre_consigne","type","entreprise","poste","lieu","url","source","motif_refus","motif_detail","site_entreprise","linkedin_entreprise","liens_manuels"];
// A preparation request also carries what the page knows of the follow-up (PREP-10).
var CHAMPS_PREPARATION=["preparation_demandee_le","pretentions","entretien_infos","preparation_consigne","date_postulee","suite","contact","notes","texte_offre"];
function pourLeMoteur(d){
  var o={};CHAMPS_MOTEUR.forEach(function(k){if(d[k]!=null&&d[k]!=="")o[k]=d[k];});
  if(d.texte_offre)o.texte_offre=d.texte_offre;
  if(d.preparation_demandee_le)CHAMPS_PREPARATION.forEach(function(k){if(d[k]!=null&&d[k]!=="")o[k]=d[k];});
  return o;
}
// Page → engine (PAGE-37): one call at a time, changes in quick succession go together.
function envoyer(){
  if(!moteur.mcp||!moteur.lu||moteur.refus||!state.loaded)return;
  if(moteur.occupe){moteur.encore=true;return;}
  moteur.occupe=true;
  moteur.mcp.callTool(SRV,"decisions",{candidatures:state.docs.map(pourLeMoteur)},{cache:false})
    .then(function(){moteur.ok=true;moteur.erreur=null;moteur.derniere=new Date();afficherMoteur();})
    .catch(echecMoteur)
    .then(function(){moteur.occupe=false;if(moteur.encore){moteur.encore=false;planifierEnvoi();}});
}
function planifierEnvoi(){if(!moteur.lu)return;clearTimeout(moteur.minuteur);moteur.minuteur=setTimeout(envoyer,3000);}
// Engine → page (PAGE-36): proposals and ready folders, imported like a file.
function synchroniser(manuel){
  if(!moteur.mcp||!col)return;
  if(moteur.refus&&!manuel)return;
  if(manuel)moteur.refus=false;
  moteur.mcp.callTool(SRV,"propositions",{},{cache:false}).then(function(r){
    var p=r&&r.payload,arr=p&&Array.isArray(p.candidatures)?p.candidatures:null;
    if(!arr)throw {code:"reponse_illisible"};
    return importRows(arr,true).then(function(){
      moteur.ok=true;moteur.erreur=null;moteur.derniere=new Date();
      var premier=!moteur.lu;moteur.lu=true;afficherMoteur();
      if(premier||manuel)envoyer();
    });
  }).catch(echecMoteur);
}
$("btn-sync").addEventListener("click",function(){synchroniser(true);});
setInterval(function(){if(document.visibilityState==="visible")synchroniser(false);},60000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")synchroniser(false);});

applyStatic();
afficherMoteur();
render();

var timer=setTimeout(function(){if(!state.loaded)say("db_slow");},10000);
function start(){
  if(!window.claude||!window.claude.use){clearTimeout(timer);state.loaded=true;afficherMoteur();say("db_open_claude","bad");render();return;}
  window.claude.use("downloads").then(function(d){downloads=d;}).catch(function(){});
  window.claude.use("mcp").then(function(m){moteur.vu=true;moteur.mcp=m;afficherMoteur();if(state.loaded&&col)synchroniser(false);}).catch(function(){moteur.vu=true;afficherMoteur();});
  window.claude.use("db").then(function(d){
    if(!d){clearTimeout(timer);state.loaded=true;say("db_open_signed","bad");render();afficherMoteur();return;}
    db=d;col=db.collection("candidatures");
    // The saved language (PAGE-64) wins over the browser's copy; a choice made before the
    // database answered is saved now.
    if(langPending)saveLang();
    else db.doc("reglages/page").get().then(function(s){var v=s&&s.exists&&s.data()?s.data().langue:null;if(v&&langInfo(v))setLang(v,false);}).catch(function(){});
    col.onSnapshot(function(snap){
      state.docs=snap.docs.map(function(s){var o=Object.assign({},s.data());o.id=s.id;return o;});
      if(!snap.metadata.fromCache||snap.docs.length){state.loaded=true;}
      if(!snap.metadata.fromCache){
        clearTimeout(timer);var premier=!state.synchro;state.loaded=true;state.synchro=true;if(state.msg&&state.msg.key==="db_slow")say(null);
        if(premier&&moteur.mcp)synchroniser(false);
      }
      render();planifierEnvoi();
    },function(e){
      clearTimeout(timer);state.loaded=true;
      say("db_stopped",{code:code(e)},"bad");render();
    });
  }).catch(function(){clearTimeout(timer);state.loaded=true;say("db_load_failed","bad");render();});
}
start();
})();
